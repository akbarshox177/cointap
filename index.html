<div class="logo">🪙 CoinTap</div>
<div class="subtitle">Tap and collect coins</div>

<div class="balance" id="balance">0</div>
<div class="coin-name">COIN</div>

<div class="tap-area" id="tapButton">
  <div class="coin">₿</div>
</div>

<div class="energy">
  ⚡️ Energy: <span id="energy">1000</span> / 1000
</div>

<div class="bar">
  <div class="bar-fill" id="energyBar"></div>
</div>

<div class="stats">
  <div class="card">
    <div class="card-title">Level</div>
    <div class="card-value" id="level">1</div>
  </div>

  <div class="card">
    <div class="card-title">Per Tap</div>
    <div class="card-value">+1 🪙</div>
  </div>
</div>

<button class="reset" id="resetButton">
  Reset demo
</button>
